# Render Blueprint: this file belongs at the Git repository root.
services:
  - type: web
    runtime: node
    name: ramarket-api
    rootDir: market_brief_render
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_LOGIN_ID
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: PRICE_FEED_URL
        sync: false
      # Expo embeds these public values into the web bundle at build time.
      # Use this API service's public HTTPS URL for EXPO_PUBLIC_API_BASE_URL.
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
  - type: cron
    name: ramarket-weekly-price-collector
    runtime: node
    rootDir: market_brief_render
    # Saturday 15:00 UTC is Sunday 00:00 in Asia/Seoul (KST, UTC+9).
    schedule: "0 15 * * 6"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm run job:weekly-ram-market
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NAVER_SHOPPING_PROVIDER_URL
        sync: false
      - key: NAVER_SHOPPING_PROVIDER_TOKEN
        sync: false
      - key: NAVER_SHOPPING_DATA_LICENSE_APPROVED
        sync: false
      - key: NAVER_SHOPPING_DATA_LICENSE_REFERENCE
        sync: false
      - key: DANAWA_RESEARCH_PROVIDER_URL
        sync: false
      - key: DANAWA_RESEARCH_PROVIDER_TOKEN
        sync: false
      - key: DANAWA_RESEARCH_DATA_LICENSE_APPROVED
        sync: false
      - key: DANAWA_RESEARCH_DATA_LICENSE_REFERENCE
        sync: false
