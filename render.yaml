# Render Blueprint: this file belongs at the Git repository root.
services:
  - type: web
    runtime: node
    name: ramarket-api
    rootDir: market_brief_render
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PRICE_FEED_URL
        sync: false
  - type: cron
    name: ramarket-weekly-price-collector
    runtime: node
    rootDir: market_brief_render
    schedule: "0 3 * * 1"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm run job:weekly-prices
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
#      - key: PRICE_FEED_URL
#        sync: false
