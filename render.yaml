# Render Blueprint: this file belongs at the Git repository root.
services:
  - type: web
    runtime: node
    name: ramarket-api
    rootDir: market_brief_render
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_LOGIN_ID
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # Expo embeds these public values into the web bundle at build time.
      # Use this API service's public HTTPS URL for EXPO_PUBLIC_API_BASE_URL.
      - key: EXPO_PUBLIC_API_BASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
